[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hrl-project-registry"
version = "0.2.0"
description = "The HRL program-assigned project-ID registry and its validator"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.11"]

[project.scripts]
hrl-project-registry = "hrl_project_registry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hrl_project_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
