[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hrl-project-registry"
version = "0.1.0"
description = "Authoritative operational registry for HRL project IDs"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-identity==1.19.0",
  "azure-storage-blob==12.24.0",
  "azure-storage-queue==12.12.0",
  "typer==0.16.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.11"]

[project.scripts]
hrl-project-registry = "hrl_project_registry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hrl_project_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
