name: Release container image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: hrl-project-registry

jobs:
  publish:
    name: Test, publish, and record digest
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewers before its
    # Azure workload identity is granted ACR push permission.
    environment: acr-publish
    steps:
      - uses: actions/checkout@v4

      - name: Require the protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Release images only from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run tests and lint
        run: |
          pytest
          ruff check .

      - name: Build image
        env:
          IMAGE_TAG: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .

      - name: Authenticate to Azure with the release service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push image and create Terraform handoff
        id: handoff
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          pushed_reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          digest="${pushed_reference##*@}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unable to determine an immutable image digest." >&2
            exit 1
          fi

          mkdir image-release-handoff
          image_reference="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${digest}"
          printf '%s\n' "$image_reference" > image-release-handoff/image-reference.txt
          jq -n \
            --arg image_reference "$image_reference" \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{image_reference: $image_reference, source_commit: $source_commit, source_repository: $source_repository, workflow_run: $workflow_run}' \
            > image-release-handoff/release-metadata.json
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Publish release summary
        run: |
          {
            echo '## Immutable image release'
            echo
            echo 'Update the infrastructure repository through its normal reviewed pull request using:'
            echo
            echo '```text'
            echo '${{ steps.handoff.outputs.image_reference }}'
            echo '```'
            echo
            echo 'This workflow does not have permission to alter Terraform or a running Container Apps Job.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform handoff
        uses: actions/upload-artifact@v4
        with:
          name: image-release-handoff
          path: image-release-handoff/
          if-no-files-found: error
